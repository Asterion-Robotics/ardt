<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490"
     role="img" aria-labelledby="t d">
  <title id="t">The ros-ci image stages</title>
  <desc id="d">The build target runs the same ardt tasks a developer runs, as image build stages, and exports reports. The runtime target copies the install base, then installs its exec dependencies with rosdep, resolved from the package.xml files in that install base.</desc>

  <!--
    ros-ci: building the image is the CI run.
    Asterion brand blues, one hue separated by lightness, so the diagram stays
    readable under any colour vision deficiency. No generator or source spec is
    committed alongside this file, so the coordinates below are the original.

    Every arrow here is a straight run, so the marker's end tangent is exactly
    the direction the stroke arrives from and the heads land correctly. Add a
    curved arrow and draw its head explicitly instead; see the note in
    doc/concepts/versioning-sources.svg for why.
  -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#030189"/>
    </marker>
  </defs>

  <style>
    .plane      { stroke-width: 1.5; }
    .plane-name { font-weight: 600; font-size: 15px; text-anchor: middle; }
    .node       { fill: #ffffff; stroke-width: 1.25; }
    .solid      { stroke-width: 1.25; }
    .node-name  { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .node-sub   { font-size: 11px; text-anchor: middle; }
    .link       { fill: none; stroke: #8b93c9; stroke-width: 1.75; }
    .link-label { font-size: 12.5px; fill: #030189; }
    .tag        { font-size: 11.5px; fill: #4a5bc8; text-anchor: middle; }
    text        { font-family: Lato, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <rect class="solid" x="24" y="30" width="190" height="60" rx="6" fill="#010042"/>
  <text class="node-name" x="119.0" y="58.0" fill="#ffffff">pipelines.ros_ci</text>
  <text class="node-sub" x="119.0" y="76.0" fill="#4a5bc8">builder</text>
  <rect class="plane" x="260" y="20" width="400" height="250" rx="8" fill="#eef1ff" stroke="#0832f6"/>
  <text class="plane-name" x="460" y="46" fill="#0832f6">build target</text>
  <rect class="node" x="278" y="62" width="364" height="48" rx="6" fill="#ffffff" stroke="#b9c4ff"/>
  <text class="node-name" x="460.0" y="84.0" fill="#030189">ardt deps</text>
  <text class="node-sub" x="460.0" y="102.0" fill="#4a5bc8">rosdep, vcs</text>
  <rect class="node" x="278" y="122" width="364" height="48" rx="6" fill="#ffffff" stroke="#b9c4ff"/>
  <text class="node-name" x="460.0" y="144.0" fill="#030189">ardt build</text>
  <text class="node-sub" x="460.0" y="162.0" fill="#4a5bc8">colcon</text>
  <rect class="node" x="278" y="182" width="364" height="48" rx="6" fill="#ffffff" stroke="#b9c4ff"/>
  <text class="node-name" x="460.0" y="204.0" fill="#030189">ardt test</text>
  <text class="node-sub" x="460.0" y="222.0" fill="#4a5bc8">red tests fail the image</text>
  <rect class="node" x="278" y="242" width="364" height="20" rx="6" fill="#ffffff" stroke="#b9c4ff"/>
  <text class="node-name" x="460.0" y="257.0" fill="#4a5bc8">JUnit XML staged at /results</text>
  <path d="M 218 60 L 252 60" fill="none" stroke="#030189" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect class="solid" x="24" y="352" width="190" height="60" rx="6" fill="#010042"/>
  <text class="node-name" x="119.0" y="380.0" fill="#ffffff">base_image</text>
  <text class="node-sub" x="119.0" y="398.0" fill="#4a5bc8">plus the repo's layers</text>
  <rect class="plane" x="260" y="300" width="400" height="164" rx="8" fill="#dce2ff" stroke="#030189"/>
  <text class="plane-name" x="460" y="326" fill="#010042">runtime target</text>
  <rect class="node" x="278" y="340" width="364" height="48" rx="6" fill="#ffffff" stroke="#a9b5ee"/>
  <text class="node-name" x="460.0" y="362.0" fill="#010042">COPY the install base + CMD</text>
  <text class="node-sub" x="460.0" y="380.0" fill="#4a5bc8">always built: a broken runtime fails the run</text>
  <rect class="node" x="278" y="400" width="364" height="48" rx="6" fill="#ffffff" stroke="#a9b5ee"/>
  <text class="node-name" x="460.0" y="422.0" fill="#010042">rosdep install, exec deps only</text>
  <text class="node-sub" x="460.0" y="440.0" fill="#4a5bc8">keys from the install base's package.xml files</text>
  <path d="M 218 382 L 252 382" fill="none" stroke="#030189" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M 460 272 L 460 294" fill="none" stroke="#8b93c9" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect class="node" x="700" y="60" width="176" height="62" rx="6" fill="#ffffff" stroke="#b9c4ff"/>
  <text class="node-name" x="788.0" y="89.0" fill="#030189">pipeline-reports/</text>
  <text class="node-sub" x="788.0" y="107.0" fill="#4a5bc8">exported every run</text>
  <path d="M 664 92 L 694 92" fill="none" stroke="#030189" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect class="node" x="700" y="351" width="176" height="62" rx="6" fill="#ffffff" stroke="#a9b5ee"/>
  <text class="node-name" x="788.0" y="380.0" fill="#010042">registry</text>
  <text class="node-sub" x="788.0" y="398.0" fill="#4a5bc8">only with --publish</text>
  <path d="M 664 382 L 694 382" fill="none" stroke="#030189" stroke-width="1.75" marker-end="url(#arrow)"/>
</svg>
