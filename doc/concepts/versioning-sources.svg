<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"
     role="img" aria-labelledby="t d">
  <title id="t">Where a version comes from</title>
  <desc id="d">The git tag is the only version. Three readers derive from it: hatch-vcs at build time, ctx.version at run time, and git describe directly.</desc>

  <!--
    Versioning: one source, three readers.
    Asterion brand blues, one hue separated by lightness, so the diagram stays
    readable under any colour vision deficiency. No generator or source spec is
    committed alongside this file, so the coordinates below are the original.
  -->

  <!--
    Arrowheads, two ways, and the reason for it:

    A marker orients itself on the path's end *tangent*. On a straight run that
    is exactly the direction the stroke arrives from, so the four horizontal
    arrows use the marker below and look right.

    On the two S-curves into `hatch-vcs` and the by-hand `git describe` it did
    not. They flatten to horizontal only in their last few pixels, so the head
    went
    level while the stroke was still visibly climbing, and it read as a
    detached, skewed blob. Those two end in a straight horizontal run instead,
    with the head drawn explicitly at the geometry the marker would have
    produced (12.25 long, 6.125 half-height at stroke-width 1.75), so the two
    kinds of arrow stay indistinguishable.

    Add a curved arrow here and draw its head; do not reach for the marker.
  -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#030189"/>
    </marker>
  </defs>

  <style>
    .plane      { stroke-width: 1.5; }
    .plane-name { font-weight: 600; font-size: 15px; text-anchor: middle; }
    .node       { fill: #ffffff; stroke-width: 1.25; }
    .solid      { stroke-width: 1.25; }
    .node-name  { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .node-sub   { font-size: 11px; text-anchor: middle; }
    .link       { fill: none; stroke: #8b93c9; stroke-width: 1.75; }
    .feeds      { fill: none; stroke: #030189; stroke-width: 1.75; }
    .head       { fill: #030189; }
    .link-label { font-size: 12.5px; fill: #030189; }
    .tag        { font-size: 11.5px; fill: #4a5bc8; text-anchor: middle; }
    text        { font-family: Lato, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <rect class="solid" x="24" y="110" width="220" height="80" rx="6" fill="#010042"/>
  <text class="node-name" x="134.0" y="148.0" fill="#ffffff">git tag</text>
  <text class="node-sub" x="134.0" y="166.0" fill="#4a5bc8">the only version there is</text>
  <rect class="node" x="330" y="20" width="230" height="60" rx="6" fill="#ffffff" stroke="#b9c4ff"/>
  <text class="node-name" x="445.0" y="48.0" fill="#030189">hatch-vcs</text>
  <text class="node-sub" x="445.0" y="66.0" fill="#4a5bc8">at build time</text>
  <rect class="node" x="640" y="20" width="236" height="60" rx="6" fill="#ffffff" stroke="#a9b5ee"/>
  <text class="node-name" x="758.0" y="48.0" fill="#010042">package metadata</text>
  <text class="node-sub" x="758.0" y="66.0" fill="#4a5bc8">ardt --version</text>
  <path d="M 564 50 L 634 50" fill="none" stroke="#030189" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect class="node" x="330" y="120" width="230" height="60" rx="6" fill="#ffffff" stroke="#b9c4ff"/>
  <text class="node-name" x="445.0" y="148.0" fill="#030189">git describe</text>
  <text class="node-sub" x="445.0" y="166.0" fill="#4a5bc8">at run time</text>
  <rect class="node" x="640" y="120" width="236" height="60" rx="6" fill="#ffffff" stroke="#a9b5ee"/>
  <text class="node-name" x="758.0" y="148.0" fill="#010042">ctx.version</text>
  <text class="node-sub" x="758.0" y="166.0" fill="#4a5bc8">ardt info</text>
  <path d="M 564 150 L 634 150" fill="none" stroke="#030189" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect class="node" x="330" y="220" width="230" height="60" rx="6" fill="#ffffff" stroke="#b9c4ff"/>
  <text class="node-name" x="445.0" y="248.0" fill="#030189">git describe --dirty</text>
  <text class="node-sub" x="445.0" y="266.0" fill="#4a5bc8">by hand</text>
  <rect class="node" x="640" y="220" width="236" height="60" rx="6" fill="#ffffff" stroke="#a9b5ee"/>
  <text class="node-name" x="758.0" y="248.0" fill="#010042">the tag itself</text>
  <text class="node-sub" x="758.0" y="266.0" fill="#4a5bc8">git</text>
  <path d="M 564 250 L 634 250" fill="none" stroke="#030189" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path class="feeds" d="M 248 130 C 276 130, 276 50, 300 50 L 318 50"/>
  <path class="head" d="M 325.2 50 L 313 43.9 L 313 56.1 Z"/>
  <path d="M 248 150 L 324 150" fill="none" stroke="#030189" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path class="feeds" d="M 248 170 C 276 170, 276 250, 300 250 L 318 250"/>
  <path class="head" d="M 325.2 250 L 313 243.9 L 313 256.1 Z"/>
  <text class="link-label" x="450" y="312" fill="#010042" text-anchor="middle">they agree on a clean tag, the only publishable state</text>
</svg>
