<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="planes-title planes-desc">
  <title id="planes-title">ardt plugin planes</title>
  <desc id="planes-desc">ardt-core sits beside two plugin planes. The pipeline plane (ardt pipe run) holds ardt-pipelines, ardt-ros-pipelines and ardt-doc-pipelines. The task plane (ardt build / test / doc / dev) holds ardt-ros-tasks, ardt-doc-tasks and ardt-devcontainers. Core connects to both planes; the pipeline plane runs tasks inside containers.</desc>

  <!--
    Hand-authored replacement for a `flowchart LR` mermaid diagram. Mermaid's
    dagre renderer lays out edges that terminate on a *subgraph* poorly, and
    sphinxcontrib-mermaid forces `height: 500px` on the emitted svg, so the
    original rendered as a stretched, overlapping mess. Coordinates below are
    on a 900x400 canvas; the doc scales it to the content width.
  -->

  <!--
    Palette: the Asterion brand blues (#0832F6 wordmark, #030189 and #010042
    from the report cover), matching asterion_sphinx_style. One hue, separated
    by lightness, which is also why the two planes stay distinguishable under
    any colour vision deficiency, where the previous purple/green pair did not.
    Every text/background pairing below clears WCAG AA.
  -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#030189"/>
    </marker>
  </defs>

  <style>
    .plane      { stroke-width: 1.5; }
    .plane-name { font-weight: 600; font-size: 15px; text-anchor: middle; }
    .node       { fill: #ffffff; stroke-width: 1.25; }
    .node-name  { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .node-sub   { font-size: 11px; text-anchor: middle; }
    .link       { fill: none; stroke: #8b93c9; stroke-width: 1.75; }
    .link-label { font-size: 12.5px; fill: #030189; }
    text        { font-family: Lato, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <!-- ── pipeline plane ────────────────────────────────────────────────── -->
  <rect class="plane" x="290" y="20" width="580" height="140" rx="8"
        fill="#eef1ff" stroke="#0832f6"/>
  <text class="plane-name" x="580" y="46" fill="#0832f6">pipeline plane · ardt pipe run</text>

  <rect class="node" x="306" y="62" width="172" height="80" rx="6" stroke="#b9c4ff"/>
  <text class="node-name" x="392" y="97"  fill="#030189">ardt-pipelines</text>
  <text class="node-sub"  x="392" y="116" fill="#4a5bc8">@pipeline registry · Dagger</text>

  <rect class="node" x="494" y="62" width="172" height="80" rx="6" stroke="#b9c4ff"/>
  <text class="node-name" x="580" y="107" fill="#030189">ardt-ros-pipelines</text>

  <rect class="node" x="682" y="62" width="172" height="80" rx="6" stroke="#b9c4ff"/>
  <text class="node-name" x="768" y="107" fill="#030189">ardt-doc-pipelines</text>

  <!-- ── task plane ───────────────────────────────────────────────────── -->
  <rect class="plane" x="290" y="250" width="580" height="140" rx="8"
        fill="#dce2ff" stroke="#030189"/>
  <text class="plane-name" x="580" y="276" fill="#010042">task plane · ardt build / test / doc / dev</text>

  <rect class="node" x="306" y="292" width="172" height="80" rx="6" stroke="#a9b5ee"/>
  <text class="node-name" x="392" y="337" fill="#010042">ardt-ros-tasks</text>

  <rect class="node" x="494" y="292" width="172" height="80" rx="6" stroke="#a9b5ee"/>
  <text class="node-name" x="580" y="337" fill="#010042">ardt-doc-tasks</text>

  <rect class="node" x="682" y="292" width="172" height="80" rx="6" stroke="#a9b5ee"/>
  <text class="node-name" x="768" y="337" fill="#010042">ardt-devcontainers</text>

  <!-- ── ardt-core ────────────────────────────────────────────────────── -->
  <rect x="24" y="150" width="200" height="100" rx="6"
        fill="#010042"/>
  <text class="node-name" x="124" y="185" fill="#ffffff">ardt-core</text>
  <text class="node-sub"  x="124" y="205" fill="#c7ccef">cli · context</text>
  <text class="node-sub"  x="124" y="222" fill="#c7ccef">config · runner</text>

  <!-- core to planes: undirected, matching the original mermaid link style -->
  <path class="link" d="M 224 180 C 256 180, 258 90, 290 90"/>
  <path class="link" d="M 224 220 C 256 220, 258 320, 290 320"/>

  <!-- pipeline plane to task plane -->
  <path d="M 580 160 L 580 244" fill="none" stroke="#030189" stroke-width="1.75"
        marker-end="url(#arrow)"/>
  <text class="link-label" x="596" y="209">runs tasks inside containers</text>
</svg>
