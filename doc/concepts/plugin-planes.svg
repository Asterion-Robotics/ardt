<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="planes-title planes-desc">
  <title id="planes-title">ardt plugin planes</title>
  <desc id="planes-desc">ardt-core sits beside two plugin planes. The pipeline plane (ardt pipe run) holds ardt-pipelines, ardt-ros-pipelines and ardt-doc-pipelines. The task plane (ardt build / test / doc) holds ardt-ros-tasks, ardt-doc-tasks and ardt-dev. Core connects to both planes; the pipeline plane runs tasks inside containers.</desc>

  <!--
    Hand-authored replacement for a `flowchart LR` mermaid diagram. Mermaid's
    dagre renderer lays out edges that terminate on a *subgraph* poorly, and
    sphinxcontrib-mermaid forces `height: 500px` on the emitted svg, so the
    original rendered as a stretched, overlapping mess. Coordinates below are
    on a 900x400 canvas; the doc scales it to the content width.
  -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55708c"/>
    </marker>
  </defs>

  <style>
    .plane      { stroke-width: 1.5; }
    .plane-name { font-weight: 600; font-size: 15px; text-anchor: middle; }
    .node       { fill: #ffffff; stroke-width: 1.25; }
    .node-name  { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .node-sub   { font-size: 11px; text-anchor: middle; }
    .link       { fill: none; stroke: #7a8794; stroke-width: 1.75; }
    .link-label { font-size: 12.5px; fill: #44525f; }
    text        { font-family: Lato, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <!-- ── pipeline plane ────────────────────────────────────────────────── -->
  <rect class="plane" x="290" y="20" width="580" height="140" rx="8"
        fill="#f6f3fd" stroke="#9b8ae0"/>
  <text class="plane-name" x="580" y="46" fill="#5a48ad">pipeline plane · ardt pipe run</text>

  <rect class="node" x="306" y="62" width="172" height="80" rx="6" stroke="#b3a5e8"/>
  <text class="node-name" x="392" y="97"  fill="#3a2f6b">ardt-pipelines</text>
  <text class="node-sub"  x="392" y="116" fill="#6b5fa0">@pipeline registry · Dagger</text>

  <rect class="node" x="494" y="62" width="172" height="80" rx="6" stroke="#b3a5e8"/>
  <text class="node-name" x="580" y="107" fill="#3a2f6b">ardt-ros-pipelines</text>

  <rect class="node" x="682" y="62" width="172" height="80" rx="6" stroke="#b3a5e8"/>
  <text class="node-name" x="768" y="107" fill="#3a2f6b">ardt-doc-pipelines</text>

  <!-- ── task plane ───────────────────────────────────────────────────── -->
  <rect class="plane" x="290" y="250" width="580" height="140" rx="8"
        fill="#eef8f2" stroke="#5fb98a"/>
  <text class="plane-name" x="580" y="276" fill="#2b7a55">task plane · ardt build / test / doc</text>

  <rect class="node" x="306" y="292" width="172" height="80" rx="6" stroke="#86ccab"/>
  <text class="node-name" x="392" y="337" fill="#1f5c40">ardt-ros-tasks</text>

  <rect class="node" x="494" y="292" width="172" height="80" rx="6" stroke="#86ccab"/>
  <text class="node-name" x="580" y="337" fill="#1f5c40">ardt-doc-tasks</text>

  <rect class="node" x="682" y="292" width="172" height="80" rx="6" stroke="#86ccab"/>
  <text class="node-name" x="768" y="337" fill="#1f5c40">ardt-dev</text>

  <!-- ── ardt-core ────────────────────────────────────────────────────── -->
  <rect x="24" y="150" width="200" height="100" rx="6"
        fill="#eaf0f6" stroke="#55708c" stroke-width="1.5"/>
  <text class="node-name" x="124" y="185" fill="#22303f">ardt-core</text>
  <text class="node-sub"  x="124" y="205" fill="#4a5f73">cli · context</text>
  <text class="node-sub"  x="124" y="222" fill="#4a5f73">config · runner</text>

  <!-- core to planes: undirected, matching the original mermaid link style -->
  <path class="link" d="M 224 180 C 256 180, 258 90, 290 90"/>
  <path class="link" d="M 224 220 C 256 220, 258 320, 290 320"/>

  <!-- pipeline plane to task plane -->
  <path d="M 580 160 L 580 244" fill="none" stroke="#55708c" stroke-width="1.75"
        marker-end="url(#arrow)"/>
  <text class="link-label" x="596" y="209">runs tasks inside containers</text>
</svg>
