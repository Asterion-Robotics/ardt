<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-labelledby="planes-title planes-desc">
  <title id="planes-title">ardt plugin planes</title>
  <desc id="planes-desc">ardt-core sits beside three plugin planes, each ending in a dotted placeholder for a plugin you write yourself. Two of them stand up containers: the pipeline plane (ardt pipe run) holds ardt-pipelines, ardt-ros-pipelines, ardt-doc-pipelines and a custom pipeline; the devcontainer plane (ardt dev) holds ardt-devcontainers, ardt-ros-dev and a custom profile. The task plane (ardt build / test / doc) holds ardt-ros-tasks, ardt-doc-tasks and a custom task. Core connects to all three; both container planes run the same tasks inside a container, which is what keeps CI and the dev container from drifting.</desc>

  <!--
    Hand-authored replacement for a `flowchart LR` mermaid diagram. Mermaid's
    dagre renderer lays out edges that terminate on a *subgraph* poorly, and
    sphinxcontrib-mermaid forces `height: 500px` on the emitted svg, so the
    original rendered as a stretched, overlapping mess. Coordinates below are
    on a 1160x560 canvas; the doc scales it to the content width.
  -->

  <!--
    Three bands, not two. The pipeline plane and the devcontainer plane are
    *peers*: both stand up a container and run the task plane inside it, and
    they differ only in engine (Dagger vs docker compose) and audience (CI vs a
    human). This diagram used to draw ardt-devcontainers inside the task plane,
    which held while `ardt dev` was one undivided distribution; it put the
    engine at the head of the "runs tasks inside containers" arrow when it
    belongs at the tail.

    The two arrows converging on one task plane ARE the parity rule: the same
    tasks, from the same `ardt:` pin, in both containers. `ardt dev doctor`
    fails when they drift.
  -->

  <!--
    Every band ends in a *dotted* slot: a plugin someone else writes. It is
    drawn, rather than left to the prose, because the planes are extension
    points first and a package list second — a reader who only looks at the
    picture should still see where their own pipeline, profile or task goes.

    The slot takes the same stroke colour as the real nodes beside it and
    differs only in dash and italics. A darker stroke would read as *more*
    prominent than the packages ardt actually ships, since those are outlined
    in a deliberately light blue; hierarchy here is carried by weight, not by
    contrast.

    Nodes sit on a 188px pitch (172 wide, 16 apart). The pipeline plane fills
    four of them; the other two centre three in the same band, which is how
    this diagram already handled unequal plane sizes.
  -->

  <style>
    .plane      { stroke-width: 1.5; }
    .plane-name { font-weight: 600; font-size: 15px; text-anchor: middle; }
    .node       { fill: #ffffff; stroke-width: 1.25; }
    .slot       { fill: #ffffff; stroke-width: 1.25; stroke-dasharray: 6 5; }
    .node-name  { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .slot-name  { font-size: 14px; font-style: italic; text-anchor: middle; }
    .node-sub   { font-size: 11px; text-anchor: middle; }
    .link       { fill: none; stroke: #8b93c9; stroke-width: 1.75; }
    .feeds      { fill: none; stroke: #030189; stroke-width: 1.75; }
    .head       { fill: #030189; }
    .link-label { font-size: 12.5px; fill: #030189; text-anchor: middle; }
    text        { font-family: Lato, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <!-- ── pipeline plane ────────────────────────────────────────────────── -->
  <rect class="plane" x="280" y="24" width="768" height="140" rx="8"
        fill="#eef1ff" stroke="#0832f6"/>
  <text class="plane-name" x="664" y="50" fill="#0832f6">pipeline plane · ardt pipe run</text>

  <rect class="node" x="296" y="66" width="172" height="80" rx="6" stroke="#b9c4ff"/>
  <text class="node-name" x="382" y="101" fill="#030189">ardt-pipelines</text>
  <text class="node-sub"  x="382" y="120" fill="#4a5bc8">@pipeline registry · Dagger</text>

  <rect class="node" x="484" y="66" width="172" height="80" rx="6" stroke="#b9c4ff"/>
  <text class="node-name" x="570" y="111" fill="#030189">ardt-ros-pipelines</text>

  <rect class="node" x="672" y="66" width="172" height="80" rx="6" stroke="#b9c4ff"/>
  <text class="node-name" x="758" y="111" fill="#030189">ardt-doc-pipelines</text>

  <rect class="slot" x="860" y="66" width="172" height="80" rx="6" stroke="#b9c4ff"/>
  <text class="slot-name" x="946" y="111" fill="#4a5bc8">Some custom pipeline</text>

  <!-- ── devcontainer plane ───────────────────────────────────────────── -->
  <rect class="plane" x="280" y="204" width="768" height="140" rx="8"
        fill="#eef1ff" stroke="#0832f6"/>
  <text class="plane-name" x="664" y="230" fill="#0832f6">devcontainer plane · ardt dev</text>

  <rect class="node" x="390" y="246" width="172" height="80" rx="6" stroke="#b9c4ff"/>
  <text class="node-name" x="476" y="281" fill="#030189">ardt-devcontainers</text>
  <text class="node-sub"  x="476" y="300" fill="#4a5bc8">render · docker compose</text>

  <rect class="node" x="578" y="246" width="172" height="80" rx="6" stroke="#b9c4ff"/>
  <text class="node-name" x="664" y="281" fill="#030189">ardt-ros-dev</text>
  <text class="node-sub"  x="664" y="300" fill="#4a5bc8">the ros2 profile</text>

  <rect class="slot" x="766" y="246" width="172" height="80" rx="6" stroke="#b9c4ff"/>
  <text class="slot-name" x="852" y="291" fill="#4a5bc8">Some custom profile</text>

  <!-- ── task plane ───────────────────────────────────────────────────── -->
  <rect class="plane" x="280" y="384" width="768" height="140" rx="8"
        fill="#dce2ff" stroke="#030189"/>
  <text class="plane-name" x="664" y="410" fill="#010042">task plane · ardt build / test / doc</text>

  <rect class="node" x="390" y="426" width="172" height="80" rx="6" stroke="#a9b5ee"/>
  <text class="node-name" x="476" y="471" fill="#010042">ardt-ros-tasks</text>

  <rect class="node" x="578" y="426" width="172" height="80" rx="6" stroke="#a9b5ee"/>
  <text class="node-name" x="664" y="471" fill="#010042">ardt-doc-tasks</text>

  <rect class="slot" x="766" y="426" width="172" height="80" rx="6" stroke="#a9b5ee"/>
  <text class="slot-name" x="852" y="471" fill="#2c3573">Some custom task</text>

  <!-- ── ardt-core ────────────────────────────────────────────────────── -->
  <rect x="24" y="224" width="200" height="100" rx="6"
        fill="#010042"/>
  <text class="node-name" x="124" y="259" fill="#ffffff">ardt-core</text>
  <text class="node-sub"  x="124" y="279" fill="#c7ccef">cli · context</text>
  <text class="node-sub"  x="124" y="296" fill="#c7ccef">config · runner</text>

  <!-- core to planes: undirected, matching the original mermaid link style -->
  <path class="link" d="M 224 250 C 252 250, 252 94, 280 94"/>
  <path class="link" d="M 224 274 L 280 274"/>
  <path class="link" d="M 224 298 C 252 298, 252 454, 280 454"/>

  <!-- Both container planes into the task plane, routed clear of the bands.
       The outer route lands lower than the inner one so the two never cross;
       which entry point each takes on the band's edge carries no meaning.

       Each route ends in a straight horizontal run and the head is an explicit
       triangle, not a marker. A marker orients itself on the path's end
       *tangent*: on a curve turning this tightly it lands looking like a
       detached diagonal blob, because the stroke is still visibly descending
       where the head has already gone horizontal. Drawing both means the head
       points where the stroke actually arrives, in every renderer. -->
  <path class="feeds" d="M 1048 94 Q 1134 94 1134 112 L 1134 468 Q 1134 486 1116 486 L 1060 486"/>
  <path class="feeds" d="M 1048 274 Q 1094 274 1094 292 L 1094 404 Q 1094 422 1076 422 L 1060 422"/>
  <path class="head" d="M 1048 486 L 1064 480.5 L 1064 491.5 Z"/>
  <path class="head" d="M 1048 422 L 1064 416.5 L 1064 427.5 Z"/>
  <text class="link-label" x="823" y="366">both run these tasks inside a container</text>
</svg>
