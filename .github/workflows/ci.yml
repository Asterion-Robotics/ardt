# Bootstrap CI (T0.3 / milestone B0). Plain pytest + the quality gate; this is
# replaced by dogfooding (turret pipe run dogfood) once the pipeline plane lands
# in B3-B4 (07 §4, §10). Keep it boring until then.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ctx.version reads tags; a shallow clone hides them

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Sync workspace
        run: uv sync --frozen || uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check core (strict)
        run: uv run pyright packages/ardt-core/src

      - name: Test with coverage gate
        run: uv run pytest --cov=ardt_core --cov-report=term-missing
