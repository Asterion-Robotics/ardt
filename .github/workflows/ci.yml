# Bootstrap CI: plain pytest + the quality gate. This is replaced by dogfooding
# (`ardt pipe run dogfood`) once the pipeline plane is finished. Keep it boring
# until then.
name: ci

on:
  push:
    branches: [main]
    # Required, not optional: once `branches:` is set, tag pushes stop
    # triggering this workflow unless `tags:` is set too. Publishing hangs off
    # these, so a missing line here is a silently dead release.
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ctx.version reads tags; a shallow clone hides them

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Sync workspace
        run: uv sync --frozen || uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check core (strict)
        run: uv run pyright packages/ardt-core/src

      - name: Test with coverage gate
        run: uv run pytest --cov=ardt_core --cov-report=term-missing

  # Dogfooding the pipeline plane: `docs-ci` builds the working tree plus every
  # ref in `pipelines.docs_ci.versions` into a Pages-ready `public/`. Dagger
  # provisions its engine over the runner's docker socket; nothing to install.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Mandatory here, not just nice-to-have: historical versions are built
          # by cloning this checkout and checking out each ref, so the objects
          # and tags have to be present locally.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --frozen || uv sync

      # ardt_source=<checkout> installs the ardt modules from this working tree
      # rather than the `ardt:` section's git pin, so the site documents the
      # commit under test. `tasks.doc.strict` defaults to true, so each version
      # runs sphinx -W --keep-going: any warning fails the job.
      - name: Build the versioned site
        run: uv run ardt pipe run docs-ci --arg ardt_source=${{ github.workspace }}

      # Not plain upload-artifact: deploy-pages only consumes the `github-pages`
      # tarball this action produces. Uploaded on every event, so a pull request
      # gets a downloadable site to review; only tags go on to deploy it.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Publishing is tag-only: main and pull requests build the site and stop.
  deploy-docs:
    needs: docs
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write # create the deployment
      id-token: write # deploy-pages authenticates over OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deliberately not the workflow-level `cancel-in-progress: true` group: a
    # half-cancelled deployment is worse than a queued one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
