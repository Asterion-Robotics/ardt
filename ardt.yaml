# ardt.yaml — ardt configuring ardt. See ardt.example.yaml for the full surface.

pipelines:
  docs_ci:
    # doc/conf.py autodocs the *installed* distributions and imports all seven,
    # so the builder needs the whole workspace, not just the task plane.
    # `[testing]` because autodoc executes what it documents and
    # `ardt_core.testing` imports pytest at module scope.
    ardt_modules:
      - ardt-core[testing]
      - ardt-pipelines
      - ardt-dev
      - ardt-ros-tasks
      - ardt-ros-pipelines
      - ardt-doc-pipelines
    # The house style: a plain sphinx extension, so no ardt distribution can
    # declare it. doc/conf.py adds it to `extensions`.
    pip_packages:
      - "asterion-sphinx-style>=0.1.0"
    versions:
      # Every release joins the site, each built from git history with its own
      # doc/ and conf.py. `ardt doc build` fails hard on a ref that carries no
      # doc/ tree and one failing ref fails the whole site, so every tag matched
      # here must postdate the docs landing on main.
      tags: "v*"
      # `branches: [main]` would add an unreleased "dev" version alongside the
      # releases. Off for now: it doubles the build and the tag is the thing
      # being published.
      branches: []
