# ardt.yaml — ardt configuring ardt. See ardt.example.yaml for the full surface.

tasks:
  doc:
    # The house style. Declared here, not in doc/conf.py, so the doc pipeline can
    # impose it on every version of the site: a release cut before the style
    # existed has no way to ask for it from its own config.
    style: [asterion_sphinx_style]

pipelines:
  docs_ci:
    # doc/conf.py autodocs the *installed* distributions and imports all eight,
    # so the builder needs the whole workspace, not just the task plane.
    # `[testing]` because autodoc executes what it documents and
    # `ardt_core.testing` imports pytest at module scope.
    ardt_modules:
      - ardt-core[testing]
      - ardt-pipelines
      - ardt-devcontainers
      - ardt-ros-dev
      - ardt-ros-tasks
      - ardt-ros-pipelines
      - ardt-doc-pipelines
    # The house style: a plain sphinx extension, so no ardt distribution can
    # declare it. doc/conf.py adds it to `extensions`.
    pip_packages:
      - "asterion-sphinx-style>=0.1.0"
    versions:
      # Every release joins the site, each built from git history with its own
      # doc/ and conf.py — but all of them inside ONE builder, whose module set
      # comes from the working tree. So a ref only builds while its conf.py
      # imports modules the current tree still ships: the devcontainer split
      # renaming `ardt_dev` made every pre-split tag unbuildable, for instance.
      #
      # That needs no glob floor here. A historical ref that fails is reported
      # and left out of the site (docs_ci._build_historical); only the working
      # tree fails the run. So `v*` can stay `v*` across any future rename.
      tags: "v*"
      # `branches: [main]` would add an unreleased "dev" version alongside the
      # releases. Off for now: it doubles the build and the tag is the thing
      # being published.
      branches: []
