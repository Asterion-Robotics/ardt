[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ardt-ros-tasks"
dynamic = ["version"]
description = "ardt tasks for ROS 2 workspaces: deps, build, test"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

# In-environment tasks: they wrap colcon/rosdep/vcs, they never vendor them.
# Nothing here may import dagger (02, the two-plane rule).
dependencies = ["ardt-core"]

[project.entry-points."ardt.commands"]
deps = "ardt_ros_tasks.cli:deps"
build = "ardt_ros_tasks.cli:build"
test = "ardt_ros_tasks.cli:test"

[tool.hatch.build.targets.wheel]
packages = ["src/ardt_ros_tasks"]

# The git tag is the only version that exists: no string in this repo states it,
# so `pyproject.toml`, `__version__` and `ctx.version` cannot drift apart. Bump
# = `git tag vX.Y.Z`. Every package here is a subdirectory of one repo, hence
# `root`; `fallback-version` keeps a .git-less source export buildable.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
