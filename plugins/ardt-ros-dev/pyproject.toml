[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ardt-ros-dev"
dynamic = ["version"]
description = "The ros2 dev profile for ardt: what a ROS 2 workspace needs in its devcontainer"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Thibault Poignonec", email = "t.poignonec@asterion-robotics.com" }]

# Data, not code: one Profile and one Dockerfile template. It depends on the
# devcontainer engine for the Profile contract and on nothing else — no dagger
# (02, the two-plane rule), and no ROS package either, since a profile only
# *describes* a ROS environment and is resolved on hosts that have none.
dependencies = ["ardt-core", "ardt-devcontainers"]

# The entry-point name is the profile name: what a repo writes in `dev.profile`.
[project.entry-points."ardt.dev_profiles"]
ros2 = "ardt_ros_dev.profile:ROS2"

[tool.hatch.build.targets.wheel]
packages = ["src/ardt_ros_dev"]

# The git tag is the only version that exists: no string in this repo states it,
# so `pyproject.toml`, `__version__` and `ctx.version` cannot drift apart. Bump
# = `git tag vX.Y.Z`. Every package here is a subdirectory of one repo, hence
# `root`; `fallback-version` keeps a .git-less source export buildable.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
