[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ardt-doc-tasks"
dynamic = ["version"]
description = "ardt documentation tasks: sphinx + doxygen/breathe + ROS 2 interface autodoc, preset-driven"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Asterion Robotics" }]
keywords = ["ci", "cli", "robotics", "ros", "sphinx", "doxygen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# The doc toolchain is pinned HERE (06 §2: the tool owns the configs and the
# dependency set; repos carry exceptions only). Bumping an extension is one MR
# in this package, applied to every repo at the next release.
dependencies = [
    "ardt-core",
    "sphinx>=7.4",
    "myst-parser>=3.0",
    "breathe>=4.36",
    "sphinx-rtd-theme>=3.0",
    "pydata-sphinx-theme>=0.15",
    "sphinxcontrib-mermaid>=0.9",
]

[project.entry-points."ardt.commands"]
doc = "ardt_doc_tasks.cli:doc"

[tool.hatch.build.targets.wheel]
packages = ["src/ardt_doc_tasks"]

# The git tag is the only version that exists: no string in this repo states it,
# so `pyproject.toml`, `__version__` and `ctx.version` cannot drift apart. Bump
# = `git tag vX.Y.Z`. Every package here is a subdirectory of one repo, hence
# `root`; `fallback-version` keeps a .git-less source export buildable.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
