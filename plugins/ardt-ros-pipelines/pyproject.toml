[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ardt-ros-pipelines"
dynamic = ["version"]
description = "ardt pipelines for ROS 2 repos: the ros-ci pipeline and the ros2 image recipe"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Thibault Poignonec", email = "t.poignonec@asterion-robotics.com" }]

# Depends on ardt-pipelines (which owns the exact dagger-io pin) — never on
# dagger directly.
dependencies = [
    "ardt-core",
    "ardt-pipelines",
]

[project.entry-points."ardt.pipelines"]
ros = "ardt_ros_pipelines.ros_ci"

[tool.hatch.build.targets.wheel]
packages = ["src/ardt_ros_pipelines"]

# The git tag is the only version that exists: no string in this repo states it,
# so `pyproject.toml`, `__version__` and `ctx.version` cannot drift apart. Bump
# = `git tag vX.Y.Z`. Every package here is a subdirectory of one repo, hence
# `root`; `fallback-version` keeps a .git-less source export buildable.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
