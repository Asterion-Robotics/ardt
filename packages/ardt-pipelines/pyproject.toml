[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ardt-pipelines"
version = "0.0.1"
description = "ardt pipeline plane: the `ardt pipe` command group, pipeline registry, shared Dagger helpers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

# The ONLY package allowed to import dagger (02, the two-plane rule); the pin is
# exact and bumped by deliberate MR run against the pipeline test suite.
dependencies = [
    "ardt-core",
    "dagger-io==0.21.7",
]

[project.entry-points."ardt.commands"]
pipe = "ardt_pipelines.cli:pipe"

[tool.hatch.build.targets.wheel]
packages = ["src/ardt_pipelines"]
