[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ardt-core"
dynamic = ["version"]
description = "ardt — the open core of Asterion Robotics' dev/CI tooling: one small core, everything else a plugin"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Thibault Poignonec", email = "t.poignonec@asterion-robotics.com" }]
keywords = ["ci", "cli", "robotics", "ros2", "dagger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# The core has zero heavy deps, by rule. dagger-io lives only in
# ardt-pipelines; anything ROS only in ardt-ros-tasks.
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.0",
]

# `ardt_core.testing` ships the shared pytest fixtures plugin authors build their
# suites on, so it imports pytest at module scope. Declaring that as an extra
# keeps the runtime install lean while making the dependency real for anyone who
# imports the module — a test suite, or sphinx autodoc executing it.
[project.optional-dependencies]
testing = ["pytest>=8.0"]

[project.scripts]
ardt = "ardt_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ardt_core"]

# The git tag is the only version that exists: no string in this repo states it,
# so `pyproject.toml`, `__version__` and `ctx.version` cannot drift apart. Bump
# = `git tag vX.Y.Z`. Every package here is a subdirectory of one repo, hence
# `root`; `fallback-version` keeps a .git-less source export buildable.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
