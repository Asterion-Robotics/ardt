[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ardt-core"
version = "0.0.1"
description = "ardt — the company-wide CLI platform: one small core, everything else a plugin"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Asterion Robotics" }]
keywords = ["ci", "cli", "robotics", "ros", "dagger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# The core has zero heavy deps, by rule (01 §2). dagger-io lives only in
# ardt-pipelines; anything ROS only in ardt-ros-tasks.
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
ardt = "ardt_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ardt_core"]
