[project]
name = "ardt-workspace"
version = "0"
description = "Development workspace for the ardt CLI platform (not published)"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ardt-core = { workspace = true }
ardt-tasks-ros = { workspace = true }
ardt-pipelines = { workspace = true }
ardt-pipelines-ros = { workspace = true }

[dependency-groups]
dev = [
    "ardt-core",
    "ardt-tasks-ros",
    "ardt-pipelines",
    "ardt-pipelines-ros",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "packages/ardt-core/src",
    "packages/ardt-tasks-ros/src",
    "packages/ardt-pipelines/src",
    "packages/ardt-pipelines-ros/src",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "B011"]

[tool.pyright]
include = ["packages/ardt-core/src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: no docker, runs anywhere",
    "integration: needs docker or a dagger engine",
    "e2e: the dogfood pipeline",
]
addopts = "-m 'not integration and not e2e' --strict-markers"

[tool.coverage.run]
source = ["ardt_core"]
branch = true

[tool.coverage.report]
# Core coverage gate (07 §9 / §10 B1): ≥ 90 %. Applied when the suite is run with
# `--cov`; the plain `pytest` default in [tool.pytest.ini_options] stays fast.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
